# Comment ESO se connecte à Vault : KV v2 monté sur secret/, authentification
# Kubernetes avec le rôle tp18-app et le jeton du ServiceAccount app-sa.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault-backend
  namespace: tp18
spec:
  provider:
    vault:
      server: http://vault.vault.svc.cluster.local:8200
      path: secret          # point de montage du moteur KV
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: tp18-app
          serviceAccountRef:
            name: app-sa
