# Ce qu'ESO doit synchroniser : secret/tp18/api (clé api-key) -> Secret api-credentials
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: api-credentials
  namespace: tp18
spec:
  refreshInterval: 15s      # court pour le lab (rotation visible vite) ; 1h en production
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: api-credentials
    creationPolicy: Owner
  data:
    - secretKey: api-key
      remoteRef:
        key: tp18/api
        property: api-key
