# Partie 5 : seconde source, AWS Secrets Manager émulé par Floci.
# Prérequis (identifiants fictifs, jamais dans Git) :
#   kubectl -n tp18 create secret generic floci-creds \
#     --from-literal=access-key=test --from-literal=secret-access-key=test
# Endpoint : variable AWS_SECRETSMANAGER_ENDPOINT ajoutée au contrôleur ESO (helm upgrade).
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: floci-secretsmanager
  namespace: tp18
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        secretRef:
          accessKeyIDSecretRef:
            name: floci-creds
            key: access-key
          secretAccessKeySecretRef:
            name: floci-creds
            key: secret-access-key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-credentials
  namespace: tp18
spec:
  refreshInterval: 30s
  secretStoreRef:
    name: floci-secretsmanager
    kind: SecretStore
  target:
    name: db-credentials
  data:
    - secretKey: password
      remoteRef:
        key: tp18/db-password     # secret "texte" (pas JSON) : pas de property
